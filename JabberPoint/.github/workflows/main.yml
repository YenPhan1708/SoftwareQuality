name: JabberPoint Java CI Pipeline

on:
  push:
    branches:
      - develop
      - test
      - acceptance
      - production

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download JUnit 5 Console Standalone Jar
        run: |
          mkdir -p libs
          curl -L -o libs/junit-platform-console-standalone.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.0/junit-platform-console-standalone-1.10.0.jar

      - name: Compile source and test code
        run: |
          mkdir -p out
          javac -cp libs/junit-platform-console-standalone.jar -d out $(find src test -name "*.java")

      - name: Run unit tests with JUnit 5
        run: |
          java -jar libs/junit-platform-console-standalone.jar \
            --class-path out \
            --scan-class-path \
            --details tree \
            --details-theme ascii
